[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-ai-engine"
version = "0.1.0"
description = "Research and AI decision engine for XAUUSD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyarrow>=17,<22",
    "scipy>=1.14,<2",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

research = [
    "polars>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
